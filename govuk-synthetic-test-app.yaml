apiVersion: v1
kind: Pod
metadata:
  name: govuk-synthetic-test-app-runner
  namespace: apps
  labels:
    app: govuk-synthetic-test-app-runner
    app.kubernetes.io/name: govuk-synthetic-test-app-runner
spec:
  serviceAccountName: synthetic-test-assumer
  restartPolicy: Never
  containers:
    - name: govuk-synthetic-test-app-runner
      image: "ghcr.io/alphagov/govuk/govuk-synthetic-test-app:pipeline-test-1"
      # image: 'ghcr.io/alphagov/govuk/govuk-synthetic-test-app:ba09f95ec441c9038ad603cc5d49fa244b407e25'
      imagePullPolicy: Always
      env:
        - name: GITHUB_PEM_STR
          valueFrom:
            secretKeyRef:
              key: govuk_synthetic-test-app_github_pem_str
              name: synthetic-test-app-github
        - name: GITHUB_INSTALL_ID
          valueFrom:
            secretKeyRef:
              key: govuk_synthetic-test-app_github_install_id
              name: synthetic-test-app-github
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              key: govuk_synthetic-test-app_github_app_id
              name: synthetic-test-app-github
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  tolerations:
    - key: arch
      operator: Equal
      value: arm64
      effect: NoSchedule
